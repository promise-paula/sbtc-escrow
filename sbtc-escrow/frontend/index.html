<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta -->
    <title>sBTC Escrow | Trustless Escrow on Bitcoin</title>
    <meta name="description" content="Secure peer-to-peer escrow payments on the Stacks blockchain with smart contract protection. Non-custodial, open-source, and auditable." />
    <meta name="author" content="sBTC Escrow" />
    <meta name="theme-color" content="#F7931A" />
    <meta name="color-scheme" content="dark light" />
    <meta name="application-name" content="sBTC Escrow" />
    <!-- Canonical is set per-route by react-helmet-async (<Seo>), so it isn't
         hardcoded here. A non-JS crawler self-canonicalizes to the served URL,
         which is correct for an SPA where index.html backs every route. -->

    <!-- Favicons — all platforms -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph. Absolute URLs are required: social scrapers don't resolve
         relative paths. og:image is a dedicated 1200x630 card for rich previews. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="sBTC Escrow" />
    <meta property="og:url" content="https://sbtcescrow.com/" />
    <meta property="og:title" content="sBTC Escrow: Trustless Escrow on Bitcoin" />
    <meta property="og:description" content="Lock STX or sBTC in a smart contract that releases only when both sides agree. Non-custodial, 0.5% flat." />
    <meta property="og:image" content="https://sbtcescrow.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="sBTC Escrow: trustless escrow on Bitcoin, 0.5% flat" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="sBTC Escrow: Trustless Escrow on Bitcoin" />
    <meta name="twitter:description" content="Lock STX or sBTC in a smart contract that releases only when both sides agree. Non-custodial, 0.5% flat." />
    <meta name="twitter:image" content="https://sbtcescrow.com/og.png" />
    <meta name="twitter:image:alt" content="sBTC Escrow: trustless escrow on Bitcoin, 0.5% flat" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "sBTC Escrow",
        "url": "https://sbtcescrow.com/",
        "description": "Trustless peer-to-peer escrow payments on the Stacks blockchain with smart contract protection.",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "All",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>

  <body>
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0c0a09">
        <div style="width:2rem;height:2rem;border:2px solid transparent;border-bottom-color:#F7931A;border-radius:50%;animation:spin 1s linear infinite"></div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
